---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Authentik
    gethomepage.dev/icon: authentik.svg
    gethomepage.dev/group: Security
    gethomepage.dev/description: OIDC User Management
    gethomepage.dev/siteMonitor: "https://sso.gddnet.io"
    # Templated: uncomment + fill HOMEPAGE_VAR_AUTHENTIK_TOKEN in
    # gdd-service/homepage/app/externalsecret.yaml for a live widget.
    # gethomepage.dev/widget.type: authentik
    # gethomepage.dev/widget.url: "https://sso.gddnet.io"
    # gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}`}}"
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      group: Security
      conditions: ["[STATUS] == 200"]
      alerts:
        - type: ntfy
        - type: discord
        - type: github
spec:
  hostnames:
    - sso.gddnet.io
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
