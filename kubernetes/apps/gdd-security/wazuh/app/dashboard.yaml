---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
spec:
  selector:
    app.kubernetes.io/name: wazuh-dashboard
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: docker.io/wazuh/wazuh-dashboard:4.14.1
          # The image seeds its keystore from these (default kibanaserver/kibanaserver)
          # and the keystore overrides opensearch.username/password in the config file.
          env:
            - name: DASHBOARD_USERNAME
              value: kibanaserver
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-secret
                  key: DASHBOARD_PASSWORD
          ports:
            - name: http
              containerPort: 5601
          startupProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
              readOnly: true
            - name: config
              mountPath: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
              subPath: wazuh.yml
              readOnly: true
            - name: ca
              mountPath: /usr/share/wazuh-dashboard/certs/root-ca.pem
              subPath: root-ca.pem
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: wazuh-secret
        - name: ca
          secret:
            secretName: wazuh-indexer-tls
            items:
              - key: ca.crt
                path: root-ca.pem
