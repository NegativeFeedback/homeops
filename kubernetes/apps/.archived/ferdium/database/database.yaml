---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ferdium
  namespace: database
spec:
  cluster:
    name: postgres
  name: gdd-service-ferdium
  owner: gdd-service-ferdium-user
  ensure: present
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ferdium-db-password
  namespace: database
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ferdium-db-secret
  namespace: database
spec:
  refreshInterval: "0" # generate password once; rotation breaks long-lived consumers (see jellystat/inventree)
  target:
    name: ferdium-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_HOST: postgres-rw.database.svc.cluster.local
        DB_PORT: "5432"
        DB_USER: gdd-service-ferdium-user
        DB_PASSWORD: "{{ .password | toString }}"
        DB_DATABASE: gdd-service-ferdium
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ferdium-db-password
