---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-actions-sync-secret
  namespace: gdd-service
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: forgejo-actions-sync-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Admin token for the local Forgejo instance.
        # Create via: Forgejo → Settings → Applications → Generate Token (scope: all)
        # Store in Bitwarden as item "forgejo-actions-sync-token" with field "token"
        FORGEJO_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: "forgejo-actions-sync-token"
        property: token
