---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app meeplestats
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      meeplestats:
        # one pod / one RWO PVC: mongo + backend + frontend share /data
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          mongo:
            image:
              repository: mongo
              tag: 4.4.29
            envFrom:
              - secretRef:
                  name: meeplestats-mongo
            probes:
              liveness: &mongoProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 27017
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *mongoProbes
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
          backend:
            image:
              repository: ghcr.io/tommythehuman/meeplestats/backend
              tag: latest
            env:
              TZ: America/Chicago
              DB_NAME: meeplestats
              UPLOAD_FOLDER: /data
              STORAGE_TYPE: local
              ENABLE_RAG: "False"
              CORS_ORIGIN: https://gamemanager.gddnet.io
              JWT_STORAGE: localstorage
              JWT_TOKEN_LOCATION: headers
              JWT_ACCESS_TOKEN_EXPIRES: "28"
              JWT_COOKIE_SECURE: "True"
              JWT_COOKIE_CSRF_PROTECT: "False"
              JWT_ACCESS_COOKIE_NAME: meeplestats
            envFrom:
              - secretRef:
                  name: meeplestats-backend
            probes:
              liveness: &backendProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &apiPort 5000
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *backendProbes
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
          frontend:
            # Vite dev server (upstream image has no prod build): needs a
            # writable /app and the image's root user.
            image:
              repository: ghcr.io/tommythehuman/meeplestats/frontend
              tag: latest
            env:
              TZ: America/Chicago
              VITE_API_URL: https://gamemanager-api.gddnet.io
              VITE_JWT_STORAGE: localstorage
              VITE_ENABLE_RAG: "False"
              VITE_ALLOWED_HOSTS: gamemanager.gddnet.io
            probes:
              liveness: &frontendProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &webPort 5173
                    httpHeaders:
                      - name: Host
                        value: gamemanager.gddnet.io
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *frontendProbes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # mongo 4.4 needs AVX; w9 has it
      nodeSelector:
        kubernetes.io/hostname: gddnet-w9
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: MeepleStats
          pangolin-operator/full-domain: gamemanager.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/meeplestats.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
        ports:
          http:
            port: *webPort
      api:
        controller: *app
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: MeepleStats API
          pangolin-operator/full-domain: gamemanager-api.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/meeplestats.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
        ports:
          http:
            port: *apiPort
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          meeplestats:
            mongo:
              - path: /data/db
                subPath: db
            backend:
              - path: /data
                subPath: uploads
      tmp:
        type: emptyDir
        advancedMounts:
          meeplestats:
            backend:
              - path: /tmp
