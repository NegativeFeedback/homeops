---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: cloudflare-tunnel
      namespace: network
  values:
    controllers:
      calibre:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/new-usemame/calibre-web-nextgen
              tag: dev-1398@sha256:40d1d75be97419a2d55af8343e0a34b6e5b91602dcf87a485799d617ca0ff531
            env:
              CACHE_DIR: /cache
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  # S6
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE

            resources:
              requests:
                cpu: 50m
                memory: 200Mi
              limits:
                memory: 600Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8083
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Calibre Web Automated
          gethomepage.dev/group: Service
          gethomepage.dev/icon: calibre-web.svg
          gethomepage.dev/name: Calibre Web
          gethomepage.dev/app: *app
          gethomepage.dev/siteMonitor: "https://books.gddnet.io"
          # Templated: uncomment + fill HOMEPAGE_VAR_CALIBREWEB_USER/_PASS in
          # gdd-service/homepage/app/externalsecret.yaml for a live widget.
          # gethomepage.dev/widget.type: calibreweb
          # gethomepage.dev/widget.url: "https://books.gddnet.io"
          # gethomepage.dev/widget.username: "{{`{{HOMEPAGE_VAR_CALIBREWEB_USER}}`}}"
          # gethomepage.dev/widget.password: "{{`{{HOMEPAGE_VAR_CALIBREWEB_PASS}}`}}"
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            group: Service
            conditions: ["[STATUS] == 200"]
        hostnames: ["books.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8083
    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /config
          - path: /calibre-library
            subPath: calibre-library
      books:
        type: nfs
        server: 10.0.30.134
        path: /medianfs/books
        globalMounts:
          - path: /cwa-book-ingest
            subPath: cwa-book-ingest

