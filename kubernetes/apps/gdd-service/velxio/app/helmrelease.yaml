---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app velxio
spec:
  interval: 1h
  # first boot downloads Arduino cores (AVR, RP2040, ESP32, ...) before nginx
  # listens — far longer than Helm's default 5m wait
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      velxio:
        # RWO PVCs — avoid two pods fighting over them
        strategy: Recreate
        containers:
          app:
            image:
              # velxio-gdd: upstream image + our overlay (BOM/PNG export, sensor chip
              # pack, Raspberry Pi / STM32 / ESP32-C6 / ESP8266 lanes).
              # Built by ~/projects/velxio-gdd CI.
              # TODO: pin to vX@sha256 once the first CI build has pushed.
              repository: git.gddnet.io/negativefeedback/velxio
              # digest-pinned: spegel resolves :latest from node caches, so a bare
              # tag + restart can come back up on a stale image.
              # sha-9ad6d27: WS2812 strips/rings on ESPHome boards, led-ring colour fix, saved switch levels reach esp32 boards
              tag: sha-9ad6d27@sha256:5348560a056b336012292307a8775ccfaccd14ae2e3b1e831382655c3e89f5d1
            env:
              TZ: America/Chicago
              DATA_DIR: /app/data
              DATABASE_URL: sqlite+aiosqlite:////app/data/velxio.db
              VELXIO_PERSISTENT_BUILD_DIR: "1"
              VELXIO_NEWS: "off"
              # Raspberry Pi lane: each running Pi is a QEMU guest (1-2 GiB RAM).
              VELXIO_PI_DIR: /var/lib/velxio-pi
              VELXIO_PI_MAX: "2"
              # Concurrent boards per lane (velxio-gdd overlay). ESP32-C6 runs on
              # Espressif esp-emu, ESP8266 sketches run natively as `nobody`,
              # STM32 on libqemu-arm built from Velxio's GPL source.
              VELXIO_C6_MAX: "4"
              VELXIO_ESP8266_MAX: "4"
              VELXIO_STM32_MAX: "4"
              # Accounts: Authentik OIDC (provider/app "velxio", made by hand).
              # Client ID/secret + session secret come from velxio-secret.
              VELXIO_PUBLIC_URL: https://velxio.gddnet.io
              VELXIO_OIDC_ISSUER: https://sso.gddnet.io/application/o/velxio/
              VELXIO_OIDC_ADMIN_GROUP: velxio-admins
              # Background runs: saved projects kept simulating by a headless
              # Chromium inside the image (~0.3-0.4 GiB per run + ~0.3 GiB browser).
              # Emulated ESPHome devices stay online as background runs (one
              # project each), so this covers VELXIO_ESPHOME_MAX plus a few others.
              VELXIO_BG_MAX: "20"
              # Emulated ESPHome devices (esp-emu, ~30-40 MiB RSS and ~0.15 CPU
              # each, measured). Every running device takes a slot whose
              # velxio-esp-NN Service (esphome-slots.yaml) presents 3232/6053/80;
              # the slot is named by the device's `wifi: use_address:` (slot IP
              # = VELXIO_ESPHOME_SLOT_IP_BASE + NN, the Services' pinned ClusterIPs).
              VELXIO_ESPHOME_MAX: "16"
              VELXIO_ESPHOME_SLOTS: "32"
              VELXIO_ESPHOME_SLOT_IP_BASE: 10.96.0.200
              VELXIO_ESPHOME_SLOT_DOMAIN: gdd-service.svc.cluster.local
            envFrom:
              - secretRef:
                  name: velxio-secret
            probes:
              # entrypoint installs arduino cores on boot; first start can take minutes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            # image requires root (nginx on :80, toolchains under /root) and a writable rootfs
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                # ESP-IDF builds (~3 GiB) + up to VELXIO_PI_MAX Pi guests (~4 GiB)
                # + up to VELXIO_BG_MAX background runs (~0.35 GiB each) incl.
                # VELXIO_ESPHOME_MAX esp-emu devices (~0.04 GiB each)
                memory: 16Gi
    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /app/data
      # Arduino cores installed on demand (AVR, RP2040, STM32duino ~2 GiB)
      arduino15:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 10Gi
        # keep across helm uninstall/remediation so cores aren't re-downloaded
        retain: true
        globalMounts:
          - path: /root/.arduino15
      arduino-libs:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /root/Arduino
      # Prepared Raspberry Pi OS base image (built once, ~2 GiB) + per-session
      # qcow2 overlays. Rebuildable, so not backed up.
      pi:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 15Gi
        retain: true
        globalMounts:
          - path: /var/lib/velxio-pi
      ccache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/ccache
      build:
        type: emptyDir
        globalMounts:
          - path: /var/lib/velxio-build
