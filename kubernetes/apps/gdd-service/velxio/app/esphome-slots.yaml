---
# ESPHome device slots for Velxio's emulated ESPHome boards (velxio-gdd
# esphome_lane). Each running emulated device takes one slot NN; the slot's
# Service presents the device's standard ports so the ESPHome dashboard, the
# esphome CLI and Home Assistant talk to it exactly like real hardware:
#
#   velxio-esp-NN  3232 (OTA) / 6053 (native API) / 80 (web_server)
#     -> velxio pod 21000+NN / 22000+NN / 23000+NN   (esp-emu hostfwd)
#
# The slot is chosen by the device's own YAML: `wifi: use_address:` set to the
# slot's pinned ClusterIP 10.96.0.(200+NN) (or the DNS name velxio-esp-NN...;
# the IP is preferred: the ESPHome dashboard otherwise falls back to the
# NAT address 192.168.4.2 the device reports over MQTT). Velxio reads that
# address out of the firmware, so adding a device needs no change here.
#
# ClusterIPs are pinned in 10.96.0.201-232: the first 256 addresses of the
# 10.96.0.0/12 service CIDR are the static band Kubernetes never hands out
# dynamically (only .1 kubernetes and .10 kube-dns live there).
# Count = VELXIO_ESPHOME_SLOTS in the HelmRelease.
---
apiVersion: v1
kind: Service
metadata:
  name: velxio-esp-01
  labels:
    app.kubernetes.io/name: velxio
    app.kubernetes.io/component: esphome-slot
spec:
  type: ClusterIP
  clusterIP: 10.96.0.201
  selector:
    app.kubernetes.io/controller: velxio
    app.kubernetes.io/instance: velxio
    app.kubernetes.io/name: velxio
  ports:
    - { name: ota, port: 3232, targetPort: 21001, protocol: TCP }
    - { name: api, port: 6053, targetPort: 22001, protocol: TCP }
    - { name: http, port: 80, targetPort: 23001, protocol: TCP }
---
