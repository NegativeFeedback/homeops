---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stasharr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      stasharr:
        strategy: RollingUpdate
        initContainers:
          init-appdata:
            # fsGroup only changes group ownership on mount; /var/lib/stasharr
            # stays owned by root, so the app's own startup chmod on that dir
            # fails as uid 1000. Fix ownership here, once, before app starts.
            image:
              repository: alpine
              tag: 3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command: ["chown", "-R", "1000:1000", "/var/lib/stasharr"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "FOWNER"]
        containers:
          app:
            image:
              repository: ghcr.io/enymawse/stasharr-portal
              tag: v0.2.0@sha256:0c9ce996bdeaf7acd442f6f42a8a270fae955eeecbf7225496bb7d5e129301ab
            env:
              TZ: America/Chicago
              # app and postgres share a pod, so they talk over localhost.
              DATABASE_HOST: localhost
              DATABASE_URL: ""
              HOST: 0.0.0.0
              PORT: &port 3000
              DATABASE_MIGRATION_MAX_ATTEMPTS: 30
              DATABASE_MIGRATION_RETRY_DELAY_SECONDS: 2
              # Tailscale ingress terminates TLS in front of this service.
              SESSION_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: stasharr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          postgres:
            image:
              repository: postgres
              tag: 17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
            env:
              # ceph-block PVCs land a lost+found dir at the mount root, which
              # makes initdb refuse to init "/var/lib/postgresql/data" directly.
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  name: stasharr-secret
            probes:
              liveness: &pgProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *pgProbes
            securityContext:
              allowPrivilegeEscalation: false
              # The postgres entrypoint must start as root to chown PGDATA and
              # initdb, then it drops to the postgres user itself.
              readOnlyRootFilesystem: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      appdata:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: ceph-block
        advancedMounts:
          stasharr:
            init-appdata:
              - path: /var/lib/stasharr
            app:
              - path: /var/lib/stasharr
      pgdata:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        advancedMounts:
          stasharr:
            postgres:
              - path: /var/lib/postgresql/data
