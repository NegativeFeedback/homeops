---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: zipline
  namespace: database
spec:
  cluster:
    name: postgres
  name: gdd-service-zipline
  owner: gdd-service-zipline-user
  ensure: present
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zipline-db-password
  namespace: database
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-db-secret
  namespace: database
spec:
  refreshInterval: "0" # generate password once; rotation breaks long-lived consumers (see jellystat/inventree)
  target:
    name: zipline-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # username/password keys are required by the CNPG Cluster's
        # managed.roles passwordSecret reference (see cluster.yaml) --
        # without them the role never gets created/synced.
        username: gdd-service-zipline-user
        password: "{{ .password | toString }}"
        DATABASE_URL: "postgresql://gdd-service-zipline-user:{{ .password | toString }}@postgres-rw.database.svc.cluster.local:5432/gdd-service-zipline"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zipline-db-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zipline-core-secret
  namespace: database
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-core-secret
  namespace: database
spec:
  refreshInterval: "0" # generate once; signs live sessions
  target:
    name: zipline-core-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CORE_SECRET: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zipline-core-secret
