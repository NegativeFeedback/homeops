---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zipline
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      zipline:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/diced/zipline
              tag: 4.7.0
            env:
              TZ: America/Chicago
              PORT: &port 3000
              CORE_RETURN_HTTPS_URLS: "true"
              CORE_DEFAULT_DOMAIN: zipline.app.gddnet.io
              DATASOURCE_TYPE: s3
              DATASOURCE_S3_BUCKET: zipline
              # zipline's S3 client (smithy) requires a full URL with scheme,
              # not a bare hostname, or it throws ERR_INVALID_URL on startup.
              DATASOURCE_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local
              DATASOURCE_S3_PORT: "80"
              DATASOURCE_S3_REGION: us-east-1
              DATASOURCE_S3_FORCE_PATH_STYLE: "true"
              DATASOURCE_S3_USE_SSL: "false"
              INVITES_ENABLED: "false"
              FEATURES_ROBOTS_TXT: "false"
              FEATURES_USER_REGISTRATION: "false"
              FEATURES_OAUTH_REGISTRATION: "true"
              FEATURES_VERSION_CHECKING: "false"
              OAUTH_LOGIN_ONLY: "true"
              OAUTH_OIDC_AUTHORIZE_URL: "https://sso.${SECRET_DOMAIN}/application/o/authorize/"
              OAUTH_OIDC_TOKEN_URL: "https://sso.${SECRET_DOMAIN}/application/o/token/"
              OAUTH_OIDC_USERINFO_URL: "https://sso.${SECRET_DOMAIN}/application/o/userinfo/"
              OAUTH_OIDC_REDIRECT_URI: "https://zipline.app.gddnet.io/api/auth/oauth/oidc"
              FILES_ROUTE: /u
              FILES_LENGTH: "6"
              FILES_DEFAULT_FORMAT: date
              FILES_DISABLED_EXTENSIONS: "ps1,pdf,bat,exe,sh,fish"
              FILES_REMOVE_GPS_METADATA: "true"
              URLS_ROUTE: /g
              URLS_LENGTH: "6"
              WEBSITE_TITLE: Zipline
              # zipline-bucket (from the ObjectBucketClaim) lives in this
              # same namespace, unlike the other zipline-secret fields --
              # the kubernetes-secret-store ClusterSecretStore is hardcoded
              # to remoteNamespace: database, so ESO can never see it there.
              # Reference it directly instead of routing through ESO.
              DATASOURCE_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: zipline-bucket
                    key: AWS_ACCESS_KEY_ID
              DATASOURCE_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: zipline-bucket
                    key: AWS_SECRET_ACCESS_KEY
            envFrom:
              - secretRef:
                  name: zipline-secret
              - secretRef:
                  name: zipline-authentik-oauth
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: Zipline
          pangolin-operator/full-domain: zipline.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/zipline.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
          pangolin-operator/target-healthcheck-enabled: "true"
          pangolin-operator/target-healthcheck-path: /
          # newt silently never starts monitoring a target whose healthcheck
          # scheme/mode/interval/etc are left null -- must set them explicitly.
          pangolin-operator/target-healthcheck-scheme: http
          pangolin-operator/target-healthcheck-mode: http
          pangolin-operator/target-healthcheck-interval: "5"
          pangolin-operator/target-healthcheck-unhealthy-interval: "30"
          pangolin-operator/target-healthcheck-timeout: "5"
          pangolin-operator/target-healthcheck-follow-redirects: "true"
          pangolin-operator/target-healthcheck-method: GET
          pangolin-operator/target-healthcheck-healthy-threshold: "1"
          pangolin-operator/target-healthcheck-unhealthy-threshold: "1"
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
      # zipline still mkdir's a local staging dir at startup even with
      # DATASOURCE_TYPE=s3 for final storage -- readOnlyRootFilesystem
      # means it needs somewhere writable to put it.
      uploads:
        type: emptyDir
        globalMounts:
          - path: /zipline/uploads
