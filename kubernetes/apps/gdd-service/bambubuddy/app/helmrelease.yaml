---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambubuddy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      bambubuddy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: daily@sha256:f30318802b556dde3e65462beeb2c79dc7347ec5bd27c723ce1bff94423e2b47
            env:
              TZ: America/Chicago
              LOG_LEVEL: INFO
              PORT: &port 8000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 4Gi
          bambu-studio-api:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.3.1b1@sha256:60d6cc91a28cdba01ba08fd1f2f18d7089bf0b62b785ad06fb3686b01cac8a3f
            env:
              NODE_ENV: production
              PORT: &slicerPort 3001
            securityContext:
              # 1.3.1b1 image ships /app/squashfs-root/bin as 0700 root, unreadable as uid 1000
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &slicerProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *slicerPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *slicerProbes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "multus-vlan60",
            "namespace": "network",
            "ips": ["10.0.60.202/24"]
          }]
      # TODO: remove nodeSelector once multus VLANs are configured on all nodes
      nodeSelector:
        kubernetes.io/hostname: gddnet-w9
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: bambubuddy
        ports:
          http:
            port: *port
          slicer:
            port: 3001
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bambubuddy:
            app:
              - path: /app/data
            bambu-studio-api:
              - path: /app/data
                subPath: slicer-bambu
      tmpfs:
        type: emptyDir
        advancedMounts:
          bambubuddy:
            app:
              - path: /app/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
            bambu-studio-api:
              - path: /tmp
                subPath: slicer-tmp
