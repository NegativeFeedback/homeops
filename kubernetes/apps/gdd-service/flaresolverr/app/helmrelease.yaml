---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app flaresolverr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      flaresolverr:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
            env:
              TZ: America/Chicago
              LOG_LEVEL: info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8191
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              # Chromium (bundled in this image) writes its profile/cache under
              # /app at runtime, so the rootfs can't be read-only here.
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # Image bakes in a fixed non-root user (flaresolverr, uid/gid 1000) rather
        # than accepting an arbitrary uid — kubelet can't verify runAsNonRoot
        # against a non-numeric image USER, so pin it explicitly.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: FlareSolverr
          pangolin-operator/full-domain: flaresolverr.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/auth-sso: "true"
          pangolin-operator/auth-sso-roles: Admin
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/flaresolverr.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
          pangolin-operator/target-healthcheck-enabled: "true"
          pangolin-operator/target-healthcheck-path: /
        ports:
          http:
            port: *port
