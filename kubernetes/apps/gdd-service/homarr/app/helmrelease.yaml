---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: cloudflare-tunnel
      namespace: network
  values:
    controllers:
      homarr:
        annotations:
          secret.reloader.stakater.com/reload: "auto"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/homarr-labs/homarr
              tag: v1.73.0
            env:
              TZ: America/Chicago
              # Homarr's image is LinuxServer.io-style: it must start as root to set up
              # nginx/redis, then drops privileges to PUID/PGID itself. It cannot start
              # directly as a non-root UID (see defaultPodOptions below + capabilities.add).
              PUID: "1000"
              PGID: "1000"
              # Beta test: native OIDC login via Authentik.
              # Create an OAuth2/OIDC "Provider" + "Application" (slug: homarr) in Authentik first,
              # redirect URI: https://homarr.${SECRET_DOMAIN}/api/auth/callback/oidc
              AUTH_OIDC_CLIENT_NAME: Authentik
              AUTH_OIDC_ISSUER: https://sso.gddnet.io/application/o/homarr/
              # Left off for now so credentials login still works while OIDC is being verified;
              # flip to "true" once the Authentik provider is confirmed working.
              AUTH_OIDC_AUTO_LOGIN: "false"
            envFrom:
              - secretRef:
                  name: homarr-secret
            probes:
              # Liveness is intentionally lenient: Homarr can get briefly busy (e.g. the
              # setup wizard firing off several concurrent integration-connection tests),
              # and a slow health check should not tear the whole pod down mid-setup.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 7575
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 6
              # Readiness can flap without killing the container, so it's fine to be stricter.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              # Homarr bundles its own nginx (config/logs/tmp under /etc/nginx, /var/lib/nginx)
              # and redis alongside the Next.js app, all expecting a writable rootfs at startup.
              # Same tradeoff Homepage makes in this repo for the same reason.
              readOnlyRootFilesystem: false
              # CHOWN/SETUID/SETGID/DAC_OVERRIDE are what let root actually fix ownership of
              # nginx's dirs and then drop to PUID/PGID; without them "root" is powerless here.
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # No runAsNonRoot/runAsUser here: the container must start as root (see PUID/PGID
        # above) — it drops to 1000:1000 itself once nginx/redis are set up.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["homarr.${SECRET_DOMAIN}"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Dashboards (Beta)"
          gethomepage.dev/name: Homarr
          gethomepage.dev/icon: homarr.svg
          gethomepage.dev/description: "OIDC | Homepage alternative (beta)"
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            group: Service
            depends-on:
              - connectivity_cftunnel
            conditions: ["[STATUS] == 200"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /appdata
      tmp:
        type: emptyDir
