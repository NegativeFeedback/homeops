---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: cloudflare-tunnel
      namespace: network
  values:
    controllers:
      homarr:
        annotations:
          secret.reloader.stakater.com/reload: "auto"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/homarr-labs/homarr
              tag: v1.73.0
            env:
              TZ: America/Chicago
              PUID: "1000"
              PGID: "1000"
              # Beta test: native OIDC login via Authentik.
              # Create an OAuth2/OIDC "Provider" + "Application" (slug: homarr) in Authentik first,
              # redirect URI: https://homarr.${SECRET_DOMAIN}/api/auth/callback/oidc
              AUTH_OIDC_CLIENT_NAME: Authentik
              AUTH_OIDC_ISSUER: https://sso.gddnet.io/application/o/homarr/
              # Left off for now so credentials login still works while OIDC is being verified;
              # flip to "true" once the Authentik provider is confirmed working.
              AUTH_OIDC_AUTO_LOGIN: "false"
            envFrom:
              - secretRef:
                  name: homarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 7575
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["homarr.${SECRET_DOMAIN}"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Dashboards (Beta)"
          gethomepage.dev/name: Homarr
          gethomepage.dev/icon: homarr.svg
          gethomepage.dev/description: "OIDC | Homepage alternative (beta)"
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            group: Service
            depends-on:
              - connectivity_cftunnel
            conditions: ["[STATUS] == 200"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /appdata
      tmp:
        type: emptyDir
