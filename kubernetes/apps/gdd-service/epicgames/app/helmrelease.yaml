---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app epicgames
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: smtp-relay
      namespace: network
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      epicgames:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/claabs/epicgames-freegames-node
              tag: latest
            env:
              TZ: America/Chicago
              BASE_URL: "https://epicgames.app.gddnet.io"
              COUNTRY_CODE: US
              CRON_SCHEDULE: "0 0,6,12,18 * * *"
              RUN_ON_STARTUP: "true"
              SEARCH_STRATEGY: all
              EMAIL_SENDER_NAME: "Epic Games Captchas"
              SMTP_HOST: smtp-relay.network.svc.cluster.local
              SMTP_PORT: "2525"
              SMTP_SECURE: "false"
            envFrom:
              - secretRef:
                  name: epicgames-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: Epic Free Games
          pangolin-operator/full-domain: epicgames.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/auth-sso: "true"
          pangolin-operator/auth-sso-roles: Admin
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/epic-games.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
        ports:
          http:
            port: &port 3000
    persistence:
      # Improvement over the reference deployment: real PVC so the Epic
      # session/config survives pod restarts instead of needing a fresh
      # interactive login every time.
      config:
        existingClaim: *app
        globalMounts:
          - path: /usr/app/config
      tmp:
        type: emptyDir
