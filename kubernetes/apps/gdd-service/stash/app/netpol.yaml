---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stash
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stash
  ingress:
    # Allow tailscale ingress proxy-group to reach the app
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
    # stasharr manages/browses this Stash instance over its API
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: stasharr
            k8s:io.kubernetes.pod.namespace: gdd-service
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
    # whisparr queries this Stash instance over its API
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: whisparr
            k8s:io.kubernetes.pod.namespace: gdd-service
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
    # stash-fileflows-sync CronJob scans/generates/identifies via the API
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: stash-fileflows-sync
            k8s:io.kubernetes.pod.namespace: gdd-service
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
  egress:
    # DNS resolution via CoreDNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:app.kubernetes.io/name: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Internet egress: metadata scrapers (StashDB/ThePornDB), image/scraper downloads
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # keepit Enrich plugin fetches keepit's /api/export
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: keepit
            k8s:io.kubernetes.pod.namespace: gdd-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Whisparr Bridge plugin pushes the matched StashDB scene back to Whisparr
    # on every Scene.Update.Post - this egress rule was missing entirely, so
    # every single push has been silently timing out (confirmed: continuous
    # TimeoutError in stash logs for 10+ days, ~every 2min).
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: whisparr
            k8s:io.kubernetes.pod.namespace: gdd-service
      toPorts:
        - ports:
            - port: "6969"
              protocol: TCP
