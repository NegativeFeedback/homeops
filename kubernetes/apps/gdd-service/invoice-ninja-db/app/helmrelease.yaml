---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app invoice-ninja-db
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  # first install pulls images slowly and initializes the datadir
  timeout: 15m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      invoice-ninja-db:
        annotations:
          secret.reloader.stakater.com/reload: "auto"
        strategy: Recreate
        containers:
          app:
            image:
              repository: mariadb
              tag: 11.3.2-jammy
            env:
              TZ: America/Chicago
              MARIADB_DATABASE: ninja
              MARIADB_USER: ninja
            envFrom:
              - secretRef:
                  name: invoice-ninja-db-secret
            # healthcheck.sh needs the healthcheck user, which this image only
            # creates with MARIADB_AUTO_UPGRADE, so probe the port instead. The
            # temporary init server has networking off, so the port only opens
            # once real startup is done; the startup probe covers slow first init.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3306
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3306
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          mariadb:
            port: 3306
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          invoice-ninja-db:
            app:
              - path: /var/lib/mysql
