---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bentopdf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      bentopdf:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/alam00000/bentopdf
              tag: 2.8.7
            env:
              TZ: America/Chicago
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            # Upstream image writes outside /tmp at startup; the reference
            # deployment runs it as root with a writable rootfs rather than
            # the usual hardened profile. Revisit if bentopdf ships a
            # non-root-friendly image later.
            # nginx-unprivileged's entrypoint chowns /var/cache/nginx/* to
            # uid 101 on startup even when already root -- CAP_CHOWN must
            # survive the drop-all or it fails with "Operation not permitted".
            # DAC_OVERRIDE is also required: without it, root can't bypass
            # the image's uid-101-owned /etc/nginx/tmp permissions either,
            # which fails opening nginx.pid with "Permission denied".
            # SETUID/SETGID are required too: the nginx master (root) drops
            # privilege to uid/gid 101 for worker processes, which needs
            # those caps or it fails with "setgid(101) failed".
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities: { drop: ["ALL"], add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: BentoPDF
          pangolin-operator/full-domain: bentopdf.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/auth-sso: "true"
          pangolin-operator/auth-sso-roles: Admin
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/bentopdf.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
          pangolin-operator/target-healthcheck-enabled: "true"
          pangolin-operator/target-healthcheck-path: /
          # newt silently never starts monitoring a target whose healthcheck
          # scheme/mode/interval/etc are left null -- must set them explicitly.
          pangolin-operator/target-healthcheck-scheme: http
          pangolin-operator/target-healthcheck-mode: http
          pangolin-operator/target-healthcheck-interval: "5"
          pangolin-operator/target-healthcheck-unhealthy-interval: "30"
          pangolin-operator/target-healthcheck-timeout: "5"
          pangolin-operator/target-healthcheck-follow-redirects: "true"
          pangolin-operator/target-healthcheck-method: GET
          pangolin-operator/target-healthcheck-healthy-threshold: "1"
          pangolin-operator/target-healthcheck-unhealthy-threshold: "1"
        ports:
          http:
            port: *port
