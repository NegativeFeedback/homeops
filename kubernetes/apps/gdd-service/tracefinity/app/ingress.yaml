---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracefinity
  annotations:
    tailscale.com/proxy-group: ts-ingress
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tools
    gethomepage.dev/name: Tracefinity
    gethomepage.dev/icon: tracefinity.svg
    gethomepage.dev/description: "Tailscale only | Background removal"
    gethomepage.dev/siteMonitor: "http://tracefinity.gdd-service.svc:3000"
spec:
  ingressClassName: tailscale
  rules:
    - host: tracefinity.barn-walleye.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracefinity
                port:
                  number: 3000
  tls:
    - hosts:
        - tracefinity.barn-walleye.ts.net
