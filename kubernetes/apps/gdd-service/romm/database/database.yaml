---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: romm
  namespace: database
spec:
  cluster:
    name: postgres
  name: gdd-service-romm
  owner: gdd-service-romm-user
  ensure: present
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: romm-db-password
  namespace: database
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-db-secret
  namespace: database
spec:
  refreshInterval: "0" # generate password once; rotation breaks long-lived consumers (see jellystat/inventree)
  target:
    name: romm-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: gdd-service-romm-user
        password: "{{ .password | toString }}"
        POSTGRES_URL: "postgresql://gdd-service-romm-user:{{ .password | toString }}@postgres-rw.database.svc.cluster.local:5432/gdd-service-romm"
        POSTGRES_HOST: "postgres-rw.database.svc.cluster.local"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "gdd-service-romm"
        POSTGRES_USER: "gdd-service-romm-user"
        POSTGRES_PASSWORD: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: romm-db-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: romm-auth-secret-key
  namespace: database
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-app-secret
  namespace: database
spec:
  refreshInterval: "0"
  target:
    name: romm-app-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: romm-auth-secret-key
