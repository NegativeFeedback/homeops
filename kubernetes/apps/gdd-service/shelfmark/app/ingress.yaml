---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shelfmark
  annotations:
    tailscale.com/proxy-group: ts-ingress
spec:
  ingressClassName: tailscale
  rules:
    - host: shelfmark.barn-walleye.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shelfmark
                port:
                  number: 8084
  tls:
    - hosts:
        - shelfmark.barn-walleye.ts.net
