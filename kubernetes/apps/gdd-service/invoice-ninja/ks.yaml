---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app invoice-ninja
  namespace: &namespace gdd-service
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: invoice-ninja-db
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/gdd-service/invoice-ninja/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      NS: *namespace
      VOLSYNC_CAPACITY: 5Gi
      # init.sh chowns storage to www-data (33)
      VOLSYNC_MOVER_FS_GROUP: "33"
      VOLSYNC_MOVER_GROUP: "33"
      VOLSYNC_MOVER_USER: "33"
      VOLSYNC_SCHEDULE_B2: '0 5 * * 4'
      VOLSYNC_SCHEDULE_LOCAL: '0 3 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
