---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keepit
spec:
  interval: 1h
  timeout: 90m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 90m
  values:
    controllers:
      keepit:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: git.gddnet.io/negativefeedback/keepit
              tag: v0.1.78@sha256:79ba7c5cd30cc8a91fdb85b5c198ca3c3b219be17ef8a507e972b1e670afa29c
            env:
              TZ: America/Chicago
              PORT: &port 8080
              DATA_PATH: /media
              DB_PATH: /db/keepit.db
              DB_BACKUP_PATH: /backup/keepit-backup.db
              REDDIT_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.3
              DEFAULT_SCRAPE_INTERVAL_HOURS: "24"
              MAX_CONCURRENT_DOWNLOADS: "12"
              DOWNLOAD_TIMEOUT_SECONDS: "180"
              FAST_CHECK_INTERVAL_MINUTES: "0"
              DELETION_CHECK_INTERVAL_HOURS: "168"
              WEBHOOK_URL: https://discord.com/api/webhooks/1441144884802224178/1tWxLnoiF-z7u-3DYi1dl1HXJWJM4BMh-2IoLI8BvV0g2J3GvtXdAEvl9viIt86hCweR
              FFMPEG_PATH: ffmpeg
              MAX_RETRIES: "3"
              YTDLP_PATH: yt-dlp
              BROWSER_HEADLESS: "true"
              SESSION_AUTO_SCRAPE: "false"
              GLUETUN_CONTROL_URL: http://localhost:8000
              VIDEO_REQUIRE_VPN: "true"
            envFrom:
              - secretRef:
                  name: keepit-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 500
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: United States
              SERVER_CITIES: Chicago,New York
              FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12,10.0.31.0/24
              HTTP_CONTROL_SERVER_ADDRESS: ":8000"
              FIREWALL_INPUT_PORTS: "8080,8000"
              HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
              # DNS-over-TLS to Cloudflare (1.0.0.1:853) gets its TLS handshake reset from every
              # ProtonVPN US exit we've tried (verified 2026-07-28: TCP/443 and plain DNS/53 work
              # fine through the same tunnel, only the DoT handshake on 853 is killed) — plain DNS
              # avoids the blocked port instead of chasing a working exit server.
              DOT: "off"
              UPDATER_PERIOD: 24h
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: keepit-gluetun-secret
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                add: ["NET_ADMIN"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/openvpn/status
                    port: 8000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  failureThreshold: 5
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["gddnet-w9"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      db:
        existingClaim: keepit-db-local
        advancedMounts:
          keepit:
            app:
              - path: /db
      # Holds only the periodic VACUUM INTO snapshot the app writes (StartBackupLoop) -- kept
      # separate from db/ so volsync can back it up with a plain live copy (copyMethod: Direct).
      # openebs-hostpath (like db/) has no CSI snapshot support, so this file being static/
      # consistent the moment it's written is what makes a non-snapshot backup safe here.
      db-backup:
        existingClaim: keepit-db-backup
        advancedMounts:
          keepit:
            app:
              - path: /backup
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 500Gi
        advancedMounts:
          keepit:
            app:
              - path: /data
      media:
        type: nfs
        server: 10.0.30.175
        path: /mnt/user/reddit
        advancedMounts:
          keepit:
            app:
              - path: /media
      tmpfs:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          keepit:
            app:
              - path: /tmp
                subPath: tmp
              - path: /dev/shm
                subPath: shm
      gluetun-auth:
        type: configMap
        name: keepit-gluetun-auth
        advancedMounts:
          keepit:
            gluetun:
              - path: /gluetun/auth/config.toml
                subPath: config.toml
                readOnly: true
