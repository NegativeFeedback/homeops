---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: linkwarden
  namespace: database
spec:
  cluster:
    name: postgres
  name: gdd-service-linkwarden
  owner: gdd-service-linkwarden-user
  ensure: present
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: linkwarden-db-password
  namespace: database
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-db-secret
  namespace: database
spec:
  refreshInterval: "0" # generate password once; rotation breaks long-lived consumers (see jellystat/inventree)
  target:
    name: linkwarden-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: gdd-service-linkwarden-user
        password: "{{ .password | toString }}"
        DATABASE_URL: "postgresql://gdd-service-linkwarden-user:{{ .password | toString }}@postgres-rw.database.svc.cluster.local:5432/gdd-service-linkwarden"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: linkwarden-db-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: linkwarden-auth-secret
  namespace: database
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-auth-secret
  namespace: database
spec:
  refreshInterval: "0" # generate once; signs live sessions
  target:
    name: linkwarden-auth-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTAUTH_SECRET: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: linkwarden-auth-secret
