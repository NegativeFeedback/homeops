---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app meshmonitor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      meshmonitor:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/yeraze/meshmonitor
              tag: latest
            env:
              NODE_ENV: development
              TZ: America/New_York
              MESHTASTIC_NODE_IP: "10.0.50.211"
              ALLOWED_ORIGINS: "https://meshmonitor.gddnet.io"
              COOKIE_SECURE: true
              TRUST_PROXY: 1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &webPort 3001
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"], add: ["CHOWN", "SETUID", "SETGID"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          tileserver:
            image:
              repository: maptiler/tileserver-gl-light
              tag: latest
            args: ["--verbose"]
            env:
              VERBOSE: "true"
            probes:
              liveness: &tileProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &tilePort 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *tileProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "multus-vlan50",
            "namespace": "network",
            "ips": ["10.0.50.212/24"]
          }]
      nodeSelector:
        kubernetes.io/hostname: gddnet-w9
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          web:
            port: *webPort
          virtualnode:
            port: 4404
          mqtt:
            port: 1883
          tiles:
            port: *tilePort
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          meshmonitor:
            app:
              - path: /data
      tiles:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        advancedMounts:
          meshmonitor:
            tileserver:
              - path: /data
