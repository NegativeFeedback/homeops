---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: cloudflare-tunnel
      namespace: network
  values:
    controllers:
      donetick:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: donetick/donetick
              tag: v0.1.76
            env:
              PROMETHEUS_ENABLED: true
              TZ: America/Chicago
              DT_ENV: selfhosted
              DT_SQLITE_PATH: /donetick-data/donetick.db
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ping
                    port: 2021
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 500Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          tailscale.com/expose: "true"
        ports:
          http:
            port: &port 2021
    serviceMonitor:
      app:
        endpoints:
          - port: http
    route:
      app:
        hostnames: ["todo.${SECRET_DOMAIN}"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Service
          gethomepage.dev/name: Donetick
          gethomepage.dev/icon: donetick.png
          gethomepage.dev/description: "Chores & task tracking"
          gethomepage.dev/siteMonitor: "https://todo.gddnet.io"
          authentik.gddnet.io/enabled: "true"
          authentik.gddnet.io/mode: oauth2
          authentik.gddnet.io/name: Donetick
          authentik.gddnet.io/category: Service
          authentik.gddnet.io/icon: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/donetick.svg"
          authentik.gddnet.io/description: "Chores & task tracking"
          authentik.gddnet.io/publisher: Donetick
          authentik.gddnet.io/allowed-groups: "sso"
          authentik.gddnet.io/oauth-redirect-uris: "https://todo.${SECRET_DOMAIN}/auth/oauth2"
          authentik.gddnet.io/oauth-secret-keys: "DONETICK_OAUTH_CLIENTID,DONETICK_OAUTH_SECRET"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      app:
        existingClaim: donetick-data
        globalMounts:
          - path: /donetick-data
      config:
        type: configMap
        name: donetick-config
        globalMounts:
          - path: "/config/selfhosted.yaml"
            subPath: selfhosted.yaml
            readOnly: true
