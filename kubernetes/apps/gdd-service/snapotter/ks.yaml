---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapotter-database
  namespace: gdd-service
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: snapotter
  interval: 1h
  path: ./kubernetes/apps/gdd-service/snapotter/database
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  timeout: 5m
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app snapotter
  namespace: &namespace gdd-service
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: snapotter-database
  components:
    - ../../../../components/volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/gdd-service/snapotter/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      NS: *namespace
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_MOVER_FS_GROUP: "1000"
      VOLSYNC_MOVER_GROUP: "1000"
      VOLSYNC_MOVER_USER: "1000"
      VOLSYNC_SCHEDULE_B2: '30 4 * * 4'
      VOLSYNC_SCHEDULE_LOCAL: '30 2 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
