---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dockhand
  annotations:
    tailscale.com/proxy-group: ts-ingress
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Dockhand
    gethomepage.dev/icon: docker.png
    gethomepage.dev/description: "Tailscale only | Docker fleet management"
    gethomepage.dev/siteMonitor: "http://dockhand.network.svc:3000"
    authentik.gddnet.io/enabled: "true"
    authentik.gddnet.io/mode: oauth2
    authentik.gddnet.io/name: Dockhand
    authentik.gddnet.io/category: Infrastructure
    authentik.gddnet.io/icon: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/docker.svg"
    authentik.gddnet.io/description: "Docker fleet management"
    authentik.gddnet.io/publisher: Finsys
    # Dockhand has no env-var based OIDC config (client id/secret/issuer are
    # entered under Settings > Authentication > OIDC Providers in its UI, or
    # via its API) — this Secret still gets created for convenience, it just
    # has to be copy-pasted in rather than wired through envFrom.
    authentik.gddnet.io/oauth-redirect-uris: "https://dockhand.barn-walleye.ts.net/api/auth/oidc/callback"
spec:
  ingressClassName: tailscale
  rules:
    - host: dockhand.barn-walleye.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dockhand
                port:
                  number: 3000
  tls:
    - hosts:
        - dockhand.barn-walleye.ts.net
