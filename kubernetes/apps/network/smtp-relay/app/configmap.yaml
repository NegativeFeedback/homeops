---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smtp-relay-config
data:
  maddy.conf: |
    # Minimal internal-only relay: accepts plaintext submission from
    # in-cluster senders on 2525 (no auth, trusts the cluster network) and
    # forwards everything to an authenticated upstream smarthost over TLS.
    # NOTE: not validated against a live maddy binary — run
    # `maddy -config /data/maddy.conf hooks run cfgcheck` (or equivalent
    # config-check subcommand for the installed version) before relying on it.
    $(hostname) = {env:SMTP_RELAY_HOSTNAME}

    tls off

    msgpipeline local_routing {
        default_destination {
            deliver_to &remote_queue
        }
    }

    smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
        hostname $(hostname)

        limits {
            all rate 20 1s
            all concurrency 10
        }

        default_source {
            default_destination {
                deliver_to &local_routing
            }
        }
    }

    target.smtp outbound_delivery {
        targets tls://{env:SMTP_RELAY_SERVER}:{env:SMTP_RELAY_SERVER_PORT}
        auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
    }

    target.queue remote_queue {
        target &outbound_delivery
        autogenerated_msg_domain $(hostname)
    }
