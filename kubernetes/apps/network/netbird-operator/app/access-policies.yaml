---
# People (access_* groups, synced from authentik via SCIM) are granted access to tiers of
# resources (tier-* / net-* groups). Policies only connect these groups, so adding a person
# or exposing a service never needs a policy edit. Policies are one-way (bidirectional: false).
# NOTE: the operator creates a NetBird rule per protocol only for ports listed here; an NBPolicy
# with no protocols/ports reports Ready but creates nothing. Datastore/infra ports are withheld
# from family/users; to expose an app on a new port, add it to the lists.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/netbird.io/group_v1alpha1.json
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: tier-users
spec:
  name: tier-users
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: tier-family
spec:
  name: tier-family
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: tier-admin
spec:
  name: tier-admin
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: net-servers
spec:
  name: net-servers
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: net-k8s
spec:
  name: net-k8s
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/netbird.io/nbpolicy_v1.json
apiVersion: netbird.io/v1
kind: NBPolicy
metadata:
  name: admin-all
spec:
  name: admin-all
  description: Administrators reach every tier and both networks
  sourceGroups:
    - access_admin
  destinationGroups:
    - tier-users
    - tier-family
    - tier-admin
    - net-servers
    - net-k8s
  bidirectional: false
  protocols:
    - tcp
    - udp
  ports:
