---
apiVersion: netbird.io/v1
kind: NBPolicy
metadata:
  name: admin-k8s-api
spec:
  name: admin-k8s-api
  description: Administrators use the cluster-admin kube API proxy
  sourceGroups:
    - access_admin
  destinationGroups:
    - k8s-admins
  bidirectional: false
  protocols:
    - tcp
  ports:
    - 443
    - 6443
