roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusterproxy-k8s-edit
subjects:
  - kind: ServiceAccount
    name: clusterproxy-k8s-edit
    namespace: network
---
apiVersion: netbird.io/v1alpha1
kind: ClusterProxy
metadata:
  name: k8s-edit
spec:
  clusterName: homeops-edit
  apiServer: https://kubernetes.default.svc.cluster.local/
  serviceAccountName: clusterproxy-k8s-edit
  groups:
    - name: k8s-editors

