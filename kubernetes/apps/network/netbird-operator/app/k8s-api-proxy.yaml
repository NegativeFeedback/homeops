---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-admins
spec:
  name: k8s-admins
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-editors
spec:
  name: k8s-editors
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-viewers
spec:
  name: k8s-viewers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: k8s-admins
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-editors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    name: k8s-editors
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: k8s-viewers
    apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterproxy-k8s-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterproxy-k8s-admin
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["userextras/*", "uids"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterproxy-k8s-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusterproxy-k8s-admin
subjects:
  - kind: ServiceAccount
    name: clusterproxy-k8s-admin
    namespace: network
---
apiVersion: netbird.io/v1alpha1
kind: ClusterProxy
metadata:
  name: k8s-admin
spec:
  clusterName: homeops-admin
  apiServer: https://kubernetes.default.svc.cluster.local/
  serviceAccountName: clusterproxy-k8s-admin
  groups:
    - name: k8s-admins

---
apiVersion: v1
