---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ttt
  namespace: database
spec:
  cluster:
    name: postgres
  name: gdd-game-ttt
  owner: gdd-game-ttt-user
  ensure: present
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ttt-db-password
  namespace: database
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ttt-db-secret
  namespace: database
spec:
  refreshInterval: "0"
  target:
    name: ttt-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:

        username: gdd-game-ttt-user
        password: "{{ .password | toString }}"
        DATABASE_URL: "postgresql://gdd-game-ttt-user:{{ .password | toString }}@postgres-rw.database.svc.cluster.local:5432/gdd-game-ttt"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ttt-db-password
