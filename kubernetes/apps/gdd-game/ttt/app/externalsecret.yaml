---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ttt-db
  namespace: gdd-game
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: ttt-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TTT_DATABASE_URL: "{{ .database_url }}"
  data:
    - secretKey: database_url
      remoteRef:
        key: ttt-db-secret
        property: DATABASE_URL
