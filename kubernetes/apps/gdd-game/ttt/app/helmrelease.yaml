---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ttt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ttt:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: git.gddnet.io/negativefeedback/bgtrack
              tag: sha-6f13182
            env:
              TZ: America/Chicago
              TTT_ENV: prod
              TTT_ADDR: ":8080"
              TTT_METRICS_ADDR: ":9090"
              TTT_LOG_LEVEL: info
              TTT_PUBLIC_URL: https://ttt.access.gddnet.io
              TTT_OIDC_ISSUER_URL: https://sso.gddnet.io/application/o/ttt/
              TTT_OIDC_DISPLAY_NAME: Authentik
              TTT_OIDC_ADMIN_GROUP: ttt-admins
              TTT_OIDC_USER_GROUP: ttt-users
              TTT_AI_BASE_URL: https://opencode.ai/inference/openai/v1
              TTT_AI_MODEL: glm-5.3-flash
              TTT_AI_CONTEXT_TOKENS: "32768"
              TTT_AI_MAX_OUTPUT_TOKENS: "16000"
              TTT_AI_TIMEOUT: 300s
              TTT_AI_NO_THINK: "true"
              TTT_AI_DAILY_RUNS: "10"
            envFrom:
              - secretRef:
                  name: ttt-secret
              - secretRef:
                  name: ttt-db
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: ttt
        ports:
          http:
            port: *port
          metrics:
            port: 9090
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics
            interval: 1m
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
