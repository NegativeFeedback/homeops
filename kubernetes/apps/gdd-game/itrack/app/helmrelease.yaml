---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: itrack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      itrack:
        strategy: Recreate
        containers:
          itrack:
            image:
              repository: git.gddnet.io/negativefeedback/itrack
              tag: d558336
            env:
              PORT: "8090"
              GAME_DIR: "/data/game"
              SESSION_DIR: "/data/steam-session"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: itrack
        ports:
          ui:
            port: 8090
          api:
            port: 2560

    persistence:
      data:
        existingClaim: itrack
        globalMounts:
          - path: /data
