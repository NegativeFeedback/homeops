---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music
  annotations:
    tailscale.com/proxy-group: ts-ingress
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Home
    gethomepage.dev/name: Music Assistant
    gethomepage.dev/icon: music-assistant.svg
    gethomepage.dev/description: "Tailscale only | Multi-room audio"
    gethomepage.dev/siteMonitor: "http://music.gdd-jarvis.svc:8095"
spec:
  ingressClassName: tailscale
  rules:
    - host: music.barn-walleye.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-app
                port:
                  number: 8095
  tls:
    - hosts:
        - music.barn-walleye.ts.net
