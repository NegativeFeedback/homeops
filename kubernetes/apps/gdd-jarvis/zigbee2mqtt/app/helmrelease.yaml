---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      zigbee2mqtt:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.13.0@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
            env:
              PROMETHEUS_ENABLED: true
              TZ: America/Chicago
              ZIGBEE2MQTT_DATA: /config
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_6af289ca5c3bec1192e4a4957a0af07f-if00-port0
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
        pod:
          nodeSelector:
            aeotec.feature.node.kubernetes.io/zwave: "true"

    service:
      app:
        annotations:
          # --- Identity / core (active) ---
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: Zigbee2MQTT
          pangolin-operator/full-domain: zigbee.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/auth-sso: "true"
          pangolin-operator/auth-sso-roles: Admin

          # --- Identity / core (reference, inactive) ---
          # pangolin-operator/enabled: "true"              # pause the resource without deleting it
          # pangolin-operator/protocol: tcp                 # tcp|udp override; omit for http
          # pangolin-operator/method: http                  # http|https|h2c backend protocol
          # pangolin-operator/ssl: "true"                   # defaults to true for http
          # pangolin-operator/host-header: custom.example.com
          # pangolin-operator/tls-server-name: custom.example.com

          # --- Auth (reference, inactive) ---
          # pangolin-operator/auth-sso-users: someone@example.com     # CSV of emails
          # pangolin-operator/auth-sso-idp: "1"                       # Pangolin IdP ID for auto-login
          # pangolin-operator/auth-whitelist-users: someone@example.com # CSV of emails
          # pangolin-operator/auth-secret: my-app-auth                # k8s Secret with pincode/password/basic-auth-user/basic-auth-password keys

          # --- Target tuning (reference, inactive) ---
          # pangolin-operator/target-path: /api
          # pangolin-operator/target-path-match: prefix       # prefix|exact|regex
          # pangolin-operator/target-rewrite-path: /
          # pangolin-operator/target-rewrite-match: stripPrefix # exact|prefix|regex|stripPrefix
          # pangolin-operator/target-priority: "100"          # 1-1000
          # pangolin-operator/target-enabled: "true"

          # --- Headers / access rules (reference, inactive; JSON blobs) ---
          # pangolin-operator/headers: '[{"name":"X-Custom-Header","value":"example"}]'
          # pangolin-operator/rules: '[{"action":"ACCEPT","match":"cidr","value":"10.0.0.0/8","priority":10}]' # action: ACCEPT|DROP|PASS, match: ip|cidr|path|country

          # --- Maintenance page (reference, inactive) ---
          # pangolin-operator/maintenance-enabled: "false"
          # pangolin-operator/maintenance-type: automatic     # forced|automatic
          # pangolin-operator/maintenance-title: "Under maintenance"
          # pangolin-operator/maintenance-message: "Back shortly"
          # pangolin-operator/maintenance-estimated-time: "30 minutes"

          # NOTE: there is no health-check annotation. The `healthcheck` field
          # on the PublicResource CRD's targets[] is unused dead schema in
          # this operator version (home-operations/charts/pangolin-operator
          # 0.1.4) - CreateTargetRequest never sends it to Pangolin's API.
          # Configure health checks by hand in the Pangolin dashboard.
        ports:
          http:
            port: &port 8080
    serviceMonitor:
      app:
        endpoints:
          - port: http

    persistence:
      app:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 500Mi
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/log
      usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_6af289ca5c3bec1192e4a4957a0af07f-if00-port0
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_6af289ca5c3bec1192e4a4957a0af07f-if00-port0