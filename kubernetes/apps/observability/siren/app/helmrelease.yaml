---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app siren
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      siren:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/shamubernetes/siren
              tag: 1.4.40
            env:
              TZ: America/Chicago
              PORT: &port 3000
              ALERTMANAGER_BASE_URL: "http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: Siren
          pangolin-operator/full-domain: siren.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/auth-sso: "true"
          pangolin-operator/auth-sso-roles: Admin
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
          pangolin-operator/target-healthcheck-enabled: "true"
          pangolin-operator/target-healthcheck-path: /livez
          # newt silently never starts monitoring a target whose healthcheck
          # scheme/mode/interval/etc are left null -- must set them explicitly.
          pangolin-operator/target-healthcheck-scheme: http
          pangolin-operator/target-healthcheck-mode: http
          pangolin-operator/target-healthcheck-interval: "5"
          pangolin-operator/target-healthcheck-unhealthy-interval: "30"
          pangolin-operator/target-healthcheck-timeout: "5"
          pangolin-operator/target-healthcheck-follow-redirects: "true"
          pangolin-operator/target-healthcheck-method: GET
          pangolin-operator/target-healthcheck-healthy-threshold: "1"
          pangolin-operator/target-healthcheck-unhealthy-threshold: "1"
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
