---
# Grafana pods join NetBird as their own (ephemeral) peers so they can reach
# the Prometheus on the VPS. The operator's NetworkRouter only exposes cluster
# services *to* peers; it gives pods no path out.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/netbird.io/setupkey_v1alpha1.json
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: grafana
spec:
  name: grafana
  ephemeral: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/netbird.io/sidecarprofile_v1alpha1.json
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: grafana
spec:
  setupKeyRef:
    name: grafana
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
