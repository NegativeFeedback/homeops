---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openstatus
  annotations:
    # The postRenderers patch below carries shell `$VAR`s; keep Flux envsubst off them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  # Upstream bug, unmerged fix openstatusHQ/openstatus#2782: tinybird-local rejects 51
  # datasources whose TTL (1/7/14/30d) is shorter than their monthly partition, so
  # `tb --local deploy` fails. Apply that PR's change (toYYYYMM -> toYYYYMMDD on those
  # 51 only) to the fetched source before deploying. Drop once upstream merges it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: openstatus-tinybird-bootstrap
            patch: |
              - op: replace
                path: /data/bootstrap.sh
                value: |
                  set -eu
                  pip install --quiet --root-user-action=ignore "tinybird==4.6.21"
                  python3 /scripts/fetch.py "$SOURCE_URL" /work
                  cd /work/packages/tinybird
                  for f in datasources/*.datasource; do
                    n=$(sed -n 's/^ENGINE_TTL "time + toIntervalDay(\([0-9]*\))"$/\1/p' "$f")
                    if [ -n "$n" ] && [ "$n" -le 30 ]; then
                      sed -i 's/^ENGINE_PARTITION_KEY "toYYYYMM(time)"$/ENGINE_PARTITION_KEY "toYYYYMMDD(time)"/' "$f"
                    fi
                  done
                  tb --local deploy
                  python3 /scripts/publish.py
  chart:
    spec:
      chart: ./charts/openstatus
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openstatus
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      tag: latest
      digests:
        openstatus-workflows: sha256:3643be114d3e9e09eeacb140cac5b511585b9f9a36e96b52ef7ec97ba53fe95d
        openstatus-server: sha256:e874682933a8ee307f98674a97d82c18cabfc7959164b699762c0f244507bb68
        openstatus-private-location: sha256:e6f7400e5aca86c81326bc3cf884bd8304ef7b24484916a060fabbc403986fe0
        openstatus-checker: sha256:a4a0779aba39b161f8b219869d5fd42a7695b4238bcb9c045976c042e12f8952
        openstatus-dashboard: sha256:50ee39bde010f4454267831010107b3474f5435572be08446d552c782e57f87d
        openstatus-status-page: sha256:e975be0e68802b3ed53c95647772990f374674f91c510b5577da6acecc415c53
        openstatus-db-migrate: sha256:7419769d2449191e68abb531355004bbacbf0451aa11862acf43acd8d60509d3

    urls:
      dashboard: https://openstatus.gddnet.io
      server: https://openstatus-api.gddnet.io

    env:
      TZ: America/Chicago
      AUTH_OIDC_ISSUER: https://sso.gddnet.io/application/o/openstatus/
      AUTH_OIDC_NAME: Authentik

    secrets:
      existingSecret: openstatus-secret

    libsql:
      image:
        digest: sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
      persistence:
        size: 5Gi
        storageClass: ceph-block

    tinybird:
      enabled: true
      image:
        digest: sha256:38fb8dcf675a51748db8c403363caafd35ef805d317c9ab80e175c7c92e752f9
      persistence:
        clickhouse:
          size: 10Gi
        redis:
          size: 1Gi
        storageClass: ceph-block
      bootstrap:
        enabled: true
        sourceUrl: https://codeload.github.com/openstatusHQ/openstatus/tar.gz/b378d3f05b2cc3f2f1046301e785e66feecd4b28
