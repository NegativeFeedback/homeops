---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
# Upstream publishes the chart only in-repo (charts/openstatus), not to a Helm/OCI registry.
# Keep `ref.commit` and the HelmRelease `tinybird.bootstrap.sourceUrl` on the same commit.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openstatus
spec:
  interval: 12h
  url: https://github.com/openstatusHQ/openstatus
  ref:
    commit: b378d3f05b2cc3f2f1046301e785e66feecd4b28
  ignore: |
    /*
    !/charts/openstatus/
