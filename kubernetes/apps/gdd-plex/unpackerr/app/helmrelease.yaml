---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unpackerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      unpackerr:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/golift/unpackerr
              tag: 0.15.2@sha256:057e34740d26c34d81ec8e2faf8ec11f8dbfc77489b7a42826f52b37e5ee1b6c
            env:
              TZ: America/Chicago
              UN_SONARR_0_URL: http://sonarr.gdd-plex.svc
              UN_SONARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: api_key
              UN_RADARR_0_URL: http://radarr.gdd-plex.svc
              UN_RADARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: api_key
              UN_WHISPARR_0_URL: http://whisparr.gdd-service.svc:6969
              UN_WHISPARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: WHISPARR_API_KEY
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_LISTEN_ADDR: "0.0.0.0:5656"
            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &port 5656
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # /mnt/p/downloads is owned 1003:100 and group-writable — join group 100
        # so unpackerr can extract there. /mnt/p/dl (root:root, likely a stricter
        # NFSv4 ACL — confirmed even real root can't write there) is read-only to
        # unpackerr until the download client's save path or that ACL changes.
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          metrics:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics

    persistence:
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: 10.0.30.134
        path: /medianfs
        globalMounts:
          - path: /mnt/media
      p:
        type: nfs
        server: 10.0.30.175
        path: /mnt/user/p
        globalMounts:
          - path: /mnt/p
