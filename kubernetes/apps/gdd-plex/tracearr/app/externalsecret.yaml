---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-secret
  namespace: gdd-plex
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: tracearr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .database_url }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        COOKIE_SECRET: "{{ .cookie_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
  data:
    - secretKey: database_url
      remoteRef:
        key: tracearr-db-secret
        property: DATABASE_URL
    - secretKey: jwt_secret
      remoteRef:
        key: tracearr-jwt-secret
        property: JWT_SECRET
    - secretKey: cookie_secret
      remoteRef:
        key: tracearr-cookie-secret
        property: COOKIE_SECRET
    - secretKey: encryption_key
      remoteRef:
        key: tracearr-encryption-key
        property: ENCRYPTION_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-maxmind
  namespace: gdd-plex
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  data:
    - secretKey: MAXMIND_LICENSE_KEY
      remoteRef:
        key: "TODO-bitwarden-item-uuid" # MaxMind GeoLite2 license key, used for viewer IP geo-tagging
