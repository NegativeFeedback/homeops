---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tracearr
  namespace: database
spec:
  cluster:
    name: postgres
  name: gdd-plex-tracearr
  owner: gdd-plex-tracearr-user
  ensure: present
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tracearr-db-password
  namespace: database
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-db-secret
  namespace: database
spec:
  refreshInterval: "0" # generate password once; rotation breaks long-lived consumers (see jellystat/inventree)
  target:
    name: tracearr-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://gdd-plex-tracearr-user:{{ .password | toString }}@postgres-rw.database.svc.cluster.local:5432/gdd-plex-tracearr"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tracearr-db-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tracearr-jwt-secret
  namespace: database
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-jwt-secret
  namespace: database
spec:
  refreshInterval: "0" # generate once; signs live session tokens
  target:
    name: tracearr-jwt-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tracearr-jwt-secret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tracearr-cookie-secret
  namespace: database
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-cookie-secret
  namespace: database
spec:
  refreshInterval: "0" # generate once; signs live session cookies
  target:
    name: tracearr-cookie-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        COOKIE_SECRET: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tracearr-cookie-secret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tracearr-encryption-key
  namespace: database
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-encryption-key
  namespace: database
spec:
  refreshInterval: "0" # generate once; rotating breaks previously-encrypted data
  target:
    name: tracearr-encryption-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ENCRYPTION_KEY: "{{ .password | toString }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tracearr-encryption-key
