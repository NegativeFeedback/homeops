---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soulsync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      soulsync:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
            env:
              TZ: America/Chicago
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
              SLSKD_APP_DIR: /config
              SLSKD_HTTP_PORT: &port 80
              SLSKD_NO_AUTH: true
              SLSKD_NO_HTTPS: true
              SLSKD_NO_VERSION_CHECK: true
              SLSKD_SLSK_LISTEN_PORT: &soulseekPort 50429

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 150Mi
              limits:
                memory: 1000Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: Soulsync
          pangolin-operator/full-domain: soulsync.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/auth-sso: "true"
          pangolin-operator/auth-sso-roles: Admin
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/soulsync.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
          pangolin-operator/target-healthcheck-enabled: "true"
          pangolin-operator/target-healthcheck-path: /ping
          # newt silently never starts monitoring a target whose healthcheck
          # scheme/mode/interval/etc are left null -- must set them explicitly.
          pangolin-operator/target-healthcheck-scheme: http
          pangolin-operator/target-healthcheck-mode: http
          pangolin-operator/target-healthcheck-interval: "5"
          pangolin-operator/target-healthcheck-unhealthy-interval: "30"
          pangolin-operator/target-healthcheck-timeout: "5"
          pangolin-operator/target-healthcheck-follow-redirects: "true"
          pangolin-operator/target-healthcheck-method: GET
          pangolin-operator/target-healthcheck-healthy-threshold: "1"
          pangolin-operator/target-healthcheck-unhealthy-threshold: "1"
        ports:
          http:
            port: *port
          soulseek:
            port: *soulseekPort
            protocol: TCP
    serviceMonitor:
      app:
        endpoints:
          - port: http

    configMaps:
      config:
        data:
          slskd.yml: |-
            directories:
              downloads: /mnt/media/music/soulseek/complete
              incomplete: /mnt/media/music/soulseek/incomplete
            transfers:
              download:
                destination:
                  permissions:
                    mode: 750
            shares:
              directories:
                - /mnt/media/music/
              filters:
                - \.ini$
                - Thumbs.db$
                - \.DS_Store$
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/slskd.yml
            subPath: slskd.yml
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: 10.0.30.134
        path: /medianfs
        globalMounts:
          - path: /mnt/media
