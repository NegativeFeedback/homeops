---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellystat
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: docker.io/cyfershepard/jellystat
              tag: 1.1.11
            env:
              TZ: America/Chicago
              POSTGRES_IP: postgres-rw.database.svc.cluster.local
              POSTGRES_PORT: 5432
              POSTGRES_DB: gdd_jellystat
              POSTGRES_USER: gdd_jellystat_user
            envFrom:
              - secretRef:
                  name: jellystat-secret

    service:
      main:
        controller: main
        annotations:
          pangolin-operator/site-ref: homeops
          pangolin-operator/name: Jellystat
          pangolin-operator/full-domain: jellystat.app.gddnet.io
          pangolin-operator/port: http
          pangolin-operator/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellystat.png
          pangolin-operator/resource-policy: thick-louisiana-waterthrush
        ports:
          http:
            port: &port 3000
